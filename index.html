<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Booking</title>
  <!-- Évite le flash au chargement : applique le thème avant le rendu -->
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="style.css?v=13">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>
  <aside class="sidebar" aria-label="Espace de travail">
    <a class="brand sidebar-brand" href="#/">DJ<span>Booking</span><small>Espace de travail</small></a>
    <div class="sidebar-label">Organisation</div>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="sidebar-footer"><div class="profile-avatar" id="profile-avatar" aria-hidden="true">DJ</div><div><strong id="profile-name"></strong><span id="profile-role"></span></div></div>
  </aside>
 <header class="topbar">
  <a class="brand" href="#/">DJ<span>Booking</span></a>
  <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav">☰</button>
  <div class="workspace-breadcrumb"><span>Espace de travail</span><span aria-hidden="true">/</span><strong id="workspace-section">Projets</strong></div>
  <div class="top-actions">
    <span id="workspace-date" class="workspace-date"></span>
    <button id="theme-toggle" class="icon-btn" aria-label="Changer le thème"></button>
    <button id="logout" class="btn small hidden">Déconnexion</button>
  </div>
</header>

  <button class="menu-scrim" id="menu-scrim" aria-label="Fermer la navigation" tabindex="-1" hidden></button>
  <div class="route-progress" aria-hidden="true"></div>
  <main id="app" class="container" tabindex="-1"></main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js?v=1.4.4" defer></script>
  <script src="enhancements.js?v=13" defer></script>
  <script src="guest-sheet.js?v=13" defer></script>
  <script src="document-viewer.js?v=13" defer></script>
  <script src="work-hours.js?v=13" defer></script>
  <script src="event-tools.js?v=13" defer></script>
  <script src="interface.js?v=13" defer></script>
  <script src="app.js?v=13" defer></script>
</body>
</html>
